eyebrow: About
heading: Independent builder. Generalist by choice.
paragraph1: Started building software in Estonia, kept at it across cities and projects. I prototype fast, ship in tight loops, and care more about how a product feels than which framework runs underneath.
paragraph2: My work spans iOS apps, web platforms, and backend services. I am comfortable across the full stack and tend to step into whatever role a small team needs — design, engineering, or product.
paragraph3: Outside of building, I read, run, and spend time with my family between Tallinn and Istanbul.
