eyebrow: About
heading: Independent builder. Generalist by choice.
paragraph1: A decade of shipping consumer software end-to-end — iOS, web, and the backend that holds them up. Started in Tallinn, kept building across Tallinn and Istanbul. Eleven years in, I still measure a good week by what made it to TestFlight on Friday.
paragraph2: I prefer small teams and direct collaboration — design, engineering, product, whatever the moment calls for. Default to boring, proven tools; bet on new ones only when the upside is large and visible. I'd rather ship a small product that someone uses every day than a large one that impresses no one.
paragraph3: Outside work, I read, run, and split time between Tallinn and Istanbul with my family.
