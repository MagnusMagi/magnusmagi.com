eyebrow: Minust
heading: Sõltumatu ehitaja. Generalist eelistusest.
paragraph1: Alustasin tarkvara ehitamisega Eestis ja olen seda jätkanud läbi linnade ja projektide. Prototüübin kiiresti, saadan välja tihedates tsüklites ja hoolin pigem sellest, kuidas toode tundub, kui sellest, milline raamistik selle all jookseb.
paragraph2: Minu töö hõlmab iOS-i rakendusi, veebiplatvorme ja tagarakenduse teenuseid. Tunnen end koduselt kogu tehnoloogiaspektril ja võtan tavaliselt selle rolli, mida väike tiim parasjagu vajab — disain, arendus või toode.
paragraph3: Lisaks ehitamisele loen, jooksen ja veedan aega perega Tallinna ja Istanbuli vahel.
