eyebrow: Minust
heading: Sõltumatu arendaja. Generalist meelega.
paragraph1: Kümme aastat olen loonud tarbijatarkvara algusest lõpuni — iOS, veeb ja tagarakendus, mis neid kannab. Alustasin Tallinnas, jätkan Tallinna ja Istanbuli vahel. Üksteist aastat hiljem mõõdan head nädalat ikka selle järgi, mis reedeks TestFlightis oli.
paragraph2: Eelistan väikseid tiime ja otsest koostööd — disain, arendus, toode, milleks parasjagu vajadust on. Vaikimisi kasutan tüütult tõestatud tööriistu; uusi võtan siis, kui kasu on suur ja ilmne. Pigem saadan välja väikese toote, mida keegi iga päev kasutab, kui suure, mis kedagi ei imeta.
paragraph3: Vabaajal loen, jooksen ja jagan aega perega Tallinna ja Istanbuli vahel.
